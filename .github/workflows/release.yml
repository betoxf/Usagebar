name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing unpublished version tag to release (for example v1.9.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Validate release tag
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Run performance and rendering regression tests
        run: ./script/test_performance.sh

      - name: Build Release
        run: |
          xcodebuild -project JustaUsageBar.xcodeproj \
            -scheme JustaUsageBar \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -destination 'generic/platform=macOS' \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGN_IDENTITY=- \
            build

      - name: Verify install and update safeguards
        run: |
          app="build/DerivedData/Build/Products/Release/Usagebar.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMultipleInstancesProhibited' "$app/Contents/Info.plist")" = "true"
          test -f "$app/Contents/Resources/install_update_and_relaunch.sh"
          test "v$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$RELEASE_TAG"
          test -f "docs/releases/$RELEASE_TAG.md"
          architectures="$(xcrun lipo -archs "$app/Contents/MacOS/Usagebar")"
          echo "Architectures: $architectures"
          [[ " $architectures " == *" arm64 "* ]]
          [[ " $architectures " == *" x86_64 "* ]]
          codesign --verify --deep --strict "$app"

      - name: Create zip
        run: |
          mkdir -p build/Release
          cp -R build/DerivedData/Build/Products/Release/Usagebar.app build/Release/
          cd build/Release && COPYFILE_DISABLE=1 zip -r -X ../../Usagebar.zip Usagebar.app

      - name: Get SHA256
        id: sha
        run: echo "sha256=$(shasum -a 256 Usagebar.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Usagebar ${{ env.RELEASE_TAG }}
          files: Usagebar.zip
          body_path: docs/releases/${{ env.RELEASE_TAG }}.md
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
